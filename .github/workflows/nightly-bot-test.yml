# Testeo nocturno del bot contra la Supabase de STAGING.
#
# Corre en la nube de GitHub (tu PC puede estar apagada), todas las noches, y
# levanta un `next dev` con BOT_TEST_MODE=1 para ejercitar el bot real SIN enviar
# WhatsApp. Dos suites:
#   - GUIONADOS: se autopuntúan (chequeoAutomatico). Si alguno sale en rojo (y no
#     es un xfail conocido), el workflow FALLA y GitHub te manda un mail. Es el
#     watchdog de regresión.
#   - EXPLORATORIOS: un cliente-agente LLM lleva el bot al límite. NO gatean el
#     workflow (no tienen oráculo); solo generan transcripts.
# Todos los transcripts quedan como artifact descargable para que Claude Code los
# juzgue a demanda (le pasás el artifact y te arma el informe ✅/⚠️/❓).
#
# ── Secrets a cargar (repo → Settings → Secrets and variables → Actions) ──
#   STAGING_SUPABASE_URL                 = https://oqrufwtuwvogdfhojips.supabase.co
#   STAGING_SUPABASE_ANON_KEY            = <anon key de staging>
#   STAGING_SUPABASE_SERVICE_ROLE_KEY    = <service_role key de staging>
#   STAGING_DB_URL                       = postgresql://postgres.oqrufwtuwvogdfhojips:<PASSWORD>@aws-1-sa-east-1.pooler.supabase.com:5432/postgres
#                                          (Session pooler, puerto 5432, password url-encodeada si tiene símbolos.
#                                           Supabase → staging → Settings → Database → Connection string → "Session pooler".
#                                           Se usa para aplicar las migraciones pendientes a staging antes de testear —
#                                           sin esto, staging driftea en silencio y el bot queda mudo, invisible.)
#   GROQ_API_KEY                         = <tu Groq API key>
# (Son claves de STAGING, no de prod: si se filtran, rotás staging sin drama.)
#
# Probalo a mano primero: pestaña Actions → "nightly-bot-test" → Run workflow.

name: nightly-bot-test

on:
  schedule:
    # Sábado 15:00 UTC = 12:00 ART (UTC-3), mediodía. GitHub Actions usa siempre UTC.
    # Se corre el sábado a propósito: el local no abre ese día, así que el nightly
    # puede quemar su parte del TPD de Groq sin competir con tráfico real de clientes.
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Qué suite correr'
        required: false
        default: 'todos'
        type: choice
        options:
          - todos
          - solo-guionados
          - solo-exploratorios

jobs:
  guionados:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BOT_TEST_MODE: '1'
      PROBAR_DELAY_MS: '6000'
      # El cliente-agente de los exploratorios NO es el sistema bajo prueba (solo
      # improvisa mensajes de cliente con generateText), así que corre en OTRO modelo
      # Groq para no gastar el bucket TPD de gpt-oss-20b, que queda entero para el
      # bot real. Sin esto comparten cubeta y la corrida se queda sin tokens.
      # (El bot bajo prueba arranca en gpt-oss-20b pero NO está fijado ahí: pasa por
      # procesarMensajesDeCliente, o sea que recorre la cadena MODELOS_EXTRACCION
      # completa ante un 429, igual que producción.)
      # (llama-3.3-70b-versatile fue dado de baja en Groq; se usa un modelo de la
      # cadena MODELOS_EXTRACCION/MODELOS_CONSULTA del bot, confirmado vigente
      # contra GET /openai/v1/models el 2026-08-22.)
      PROBAR_MODELO_CLIENTE: 'qwen/qwen3.6-27b'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de seguridad (staging + modo test)
        run: |
          test "$BOT_TEST_MODE" = "1" || { echo "::error::BOT_TEST_MODE != 1 (abortado para no mandar WhatsApp reales)"; exit 1; }
          echo "$NEXT_PUBLIC_SUPABASE_URL" | grep -q "oqrufwtuwvogdfhojips" \
            || { echo "::error::NEXT_PUBLIC_SUPABASE_URL no apunta a staging (abortado para no tocar prod)"; exit 1; }
          echo "OK: modo test + staging."

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Aplicar migraciones pendientes a staging
        # Sin esto, staging driftea en silencio: una migración nueva que el
        # esquema de staging no tiene hace fallar el camino común de TODOS los
        # mensajes (ej. `.eq('fallido', false)` sobre una columna inexistente),
        # el bot queda mudo, y el catch silencioso de procesar.ts lo esconde.
        # `db push` falla ruidoso si no puede aplicar → gatea el nightly.
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          test -n "$STAGING_DB_URL" || { echo "::error::Falta el secret STAGING_DB_URL"; exit 1; }
          echo "$STAGING_DB_URL" | grep -q "oqrufwtuwvogdfhojips" \
            || { echo "::error::STAGING_DB_URL no apunta a staging (abortado para no tocar prod)"; exit 1; }
          supabase db push --db-url "$STAGING_DB_URL"

      - name: Levantar server + correr suites
        env:
          SUITE: ${{ inputs.suite || 'todos' }}
        run: |
          npm run dev > devserver.log 2>&1 &
          DEV_PID=$!

          # Esperar a que el endpoint responda (hasta ~120s).
          listo=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:3000/api/dev/simular-conversacion \
              -H 'content-type: application/json' \
              -d '{"accion":"estado","telefono":"540000000099"}' || true)
            if [ "$code" = "200" ]; then listo=1; break; fi
            if [ "$code" = "403" ]; then
              echo "::error::El endpoint dio 403 (¿BOT_TEST_MODE apagado?)"; cat devserver.log; kill $DEV_PID 2>/dev/null; exit 1
            fi
            sleep 3
          done
          if [ "$listo" != "1" ]; then
            echo "::error::El dev server no respondió a tiempo"; cat devserver.log; kill $DEV_PID 2>/dev/null; exit 1
          fi

          set +e
          RES_GUIONADOS=0

          # 1) GUIONADOS — gatean el CI (salvo solo-exploratorios).
          if [ "$SUITE" != "solo-exploratorios" ]; then
            PROBAR_SOLO_GUIONADOS=1 PROBAR_FAIL_ON_RED=1 node scripts/probar-bot.mjs
            RES_GUIONADOS=$?
          fi

          # 2) EXPLORATORIOS — NO gatean (salvo solo-guionados).
          if [ "$SUITE" != "solo-guionados" ]; then
            PROBAR_SOLO_EXPLORATORIOS=1 PROBAR_MAX_TURNOS=6 node scripts/probar-bot.mjs || true
          fi

          kill $DEV_PID 2>/dev/null
          exit $RES_GUIONADOS

      - name: Subir transcripts (para juicio con Claude Code)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: informes-bot/**
          if-no-files-found: warn
